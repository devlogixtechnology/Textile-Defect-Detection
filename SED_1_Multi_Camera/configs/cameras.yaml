architecture_version: SED1-multicam-v1
cameras:
  camera_01:
    name: "Chemical Response Area"
    source: "Confidence_Calibration/benchmark/media/chemical_hazard_01_hazmat_training.webm"
    enabled: true
    loop: true
    sampling_fps: 5.0
    monitored_classes:
      - chemical hazard
      - fire
      - smoke
    geofences:
      - id: response_zone
        enabled: true
        classes:
          - chemical hazard
          - fire
          - smoke
        polygon:
          - [0.05, 0.10]
          - [0.95, 0.10]
          - [0.95, 0.92]
          - [0.05, 0.92]

  camera_02:
    name: "Worker Safety Zone"
    source: "Confidence_Calibration/benchmark/media/no_helmet_01_workers_roof.webm"
    enabled: true
    loop: true
    sampling_fps: 5.0
    monitored_classes:
      - no helmet
      - fire
      - smoke
    geofences:
      - id: ppe_zone
        enabled: true
        classes:
          - no helmet
          - fire
          - smoke
        polygon:
          - [0.08, 0.08]
          - [0.92, 0.08]
          - [0.92, 0.95]
          - [0.08, 0.95]

  camera_03:
    name: "Leak Monitoring Zone"
    source: "Confidence_Calibration/benchmark/media/water_leak_01_dripping_bucket.webm"
    enabled: true
    loop: true
    sampling_fps: 5.0
    monitored_classes:
      - water leak
      - chemical hazard
    geofences:
      - id: leak_zone
        enabled: true
        classes:
          - water leak
          - chemical hazard
        polygon:
          - [0.12, 0.12]
          - [0.90, 0.12]
          - [0.90, 0.92]
          - [0.12, 0.92]

  camera_04:
    name: "Smoke Watch"
    source: "Confidence_Calibration/benchmark/media/smoke_01_us_navy_rq4.webm"
    enabled: true
    loop: true
    sampling_fps: 5.0
    monitored_classes:
      - smoke
      - fire
    geofences:
      - id: smoke_zone
        enabled: true
        classes:
          - smoke
          - fire
        polygon:
          - [0.05, 0.05]
          - [0.95, 0.05]
          - [0.95, 0.95]
          - [0.05, 0.95]

